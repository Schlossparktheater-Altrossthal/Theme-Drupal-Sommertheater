################
# GitLabCI template for Drupal projects.
#
# This template is designed to give any Contrib maintainer everything they need to test, without requiring modification.
# It is also designed to keep up to date with Core Development automatically through the use of include files that can be centrally maintained.
# As long as you include the project, ref and three files below, any future updates added by the Drupal Association will be used in your
# pipelines automatically. However, you can modify this template if you have additional needs for your project.
# The full documentation is on https://project.pages.drupalcode.org/gitlab_templates/
################

# For information on alternative values for 'ref' see https://project.pages.drupalcode.org/gitlab_templates/info/templates-version/
# To test a Drupal 7 project, change the first include filename from .main.yml to .main-d7.yml
include:
  - project: $_GITLAB_TEMPLATES_REPO
    # Change back to $_GITLAB_TEMPLATES_REF when https://www.drupal.org/i/3563698 is released.
    ref: main
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"
#
################
# Pipeline configuration variables are defined with default values and descriptions in the file
# https://git.drupalcode.org/project/gitlab_templates/-/blob/main/includes/include.drupalci.variables.yml
# Uncomment the lines below if you want to override any of the variables. The following is just an example.
################
variables:
  SKIP_ESLINT: "1"
  SKIP_STYLELINT: "1"
  OPT_IN_TEST_NEXT_MINOR: "1"
  # Don't install JavaScript dependencies; they're not used in this CI process right now.
  _COMPOSER_YARN_INSTALL: "0"
  _CSPELL_IGNORE_PATHS: "build/main.min.css, package-lock.json"
  # Don't let any linting jobs fail.
  _ALL_VALIDATE_ALLOW_FAILURE: 0

stages:
  - build
  - validate
  - test
  - publish

lint:
  stage: validate
  image: node:latest
  script:
    # Install dependencies.
    - npm install
    # Run Prettier to check for formatting errors.
    - npm run format:check || (echo "Formatting errors found. Please run 'npm run format' locally to fix them." && exit 1)
  rules:
    - when: always

# Ensure that Mercury is physically installed in the Drupal code base, rather
# than symlinked, so that the theme generator can use Mercury as a starter kit.
composer:
  extends: .composer-base
  variables:
    DRUPAL_CORE: $CORE_STABLE
    IGNORE_PROJECT_DRUPAL_CORE_VERSION: 1
  before_script:
    - rm .gitattributes
    - composer archive --file=mercury --format=tar
  after_script:
    - THEME_DIR=web/themes/custom/mercury
    - rm -r -f $THEME_DIR
    - mkdir -p $THEME_DIR
    - tar -x -f mercury.tar -C $THEME_DIR
    - rm mercury.tar
    # The CVA dependency should be there.
    - test -d web/modules/contrib/cva

composer (next minor):
  extends: .composer-base
  variables:
    DRUPAL_CORE: $CORE_NEXT_MINOR
    IGNORE_PROJECT_DRUPAL_CORE_VERSION: 1
    MINIMUM_STABILITY_OVERRIDE: "dev"
  before_script:
    - !reference [composer, before_script]
  after_script:
    - !reference [composer, after_script]

release:
  stage: publish
  image: ghcr.io/drupal-canvas/drupal-testing:2.1.1
  needs: []
  rules:
    # The release flow is triggered from a v-prefixed tag, then pushes
    # the unprefixed Drupal.org release tag after committing built assets.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\d+)?$/
  before_script:
    - export VERSION=$(echo "${CI_COMMIT_TAG}" | cut -c2-)
    - git config --global user.email "no-reply@drupal.org"
    - git config --global user.name "drupal.org GitLab CI"
    - git remote set-url origin https://gitlab-ci-token:${GITLAB_CI_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
  script:
    - npm ci
    - npm run build
    # Release commits should include built assets and should not ignore build/,
    # so downstream Composer installs can commit the released files cleanly.
    - echo "!build/" >> .gitignore
    - git add .gitignore build/
    - git commit -m "Add built assets for release ${VERSION}"
    - git tag -f "$VERSION"
    - git push origin "$VERSION"
