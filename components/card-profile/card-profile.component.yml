'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Profile
description: Basic card with image, title, teaser, tags
group: Components/Cards
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading Text
      examples:
        - 'This is my title eu torquent suscipit'
    level:
      type: number
      title: Heading Level
      enum: [2,3,4,5,6]
      examples:
        - 3
    url:
      type: string
      title: Add optional url
      examples: 
        - 'https://www.example.com'
    image:
      title: Photo
      description: Media image for the hero.
      type: string
      examples:
        - 'assets/277628-911758.jpg'
    alt:
      title: Photo
      description: Alt tag for media image
      type: string
      examples:
        - 'Photo by gdtography: https://www.pexels.com/photo/long-exposure-photography-white-dome-building-interior-911758/'
    text:
      type: string
      title: Text
      description: Teaser text
      # @todo Add examples here.
      examples:
        - 'Quaerat laborum rerum dolores dolores dolor qui. Laudantium itaque sint aut culpa omnis eius pariatur. Quia laborum commodi excepturi neque tempore. Fuga dolor dolores perspiciatis.'
    radius:
      type: string
      title: Corner radius
      enum: [rounded-none, rounded-sm, rounded-md, rounded-lg, rounded-full]
      examples: 
        - rounded-sm
      default: rounded-sm 
    badges:
      type: array
      title: badges
      description: Category badges.
      items:
        type: object
        title: Badge
        description: List of badges.
        properties:
          url:
            type: string
            format: uri
          label:
            type: string
          icon: 
            type: string
          icon_first: 
            type: boolean
        examples:
          - url: 'https://www.example.com'
            label: 'badge one'
            icon: ''
            icon_first: true
          - url: 'https://www.example.com'
            label: 'badge two'
            icon: ''
            icon_first: true
    orientation:
      type: string
      title: Orientation
      description: "Set card to horz or vert."
      enum: ['stacked', 'landscape']
      examples:
        - 'stacked'
