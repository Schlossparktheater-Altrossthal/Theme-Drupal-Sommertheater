'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Profile
description: Basic card with image, title, teaser, tags
group: Components/Cards
props:
  type: object
  properties:
    name:
      type: string
      title: Person's name
      examples:
        - 'Chloe Bennett'
    job_title:
      type: string
      title: Text
      description: The person's job title
      examples:
        - 'Operations Manager'
    url:
      type: boolean
      title: Add optional url
      examples:
        - true
      default: true
    media:
      $ref: json-schema-definitions://experience_builder.module/image
      title: Card Media
      description: Media and Alt for the card.
      type: object
      examples:
        - src: 'assets/christina-wocintechchat-com-0Zx1bDv5BNY-unsplash.jpg'
          alt: 'Photo by Christina @ wocintechchat.com on Unsplash'
    radius:
      type: number
      name: Corner radius
      enum: [rounded-none, rounded-sm, rounded-md, rounded-lg, rounded-full]
      examples: 
        - rounded-sm
      default: rounded-sm 
    badge_1:
      type: object
      title: Badge text 1
      description: A category badge
      # @todo Add examples here.
      examples:
        - url: '#'
          label: 'Amazing'
    badge_2:
      type: object
      title: Badge text 2
      description: A category badge
      # @todo Add examples here.
      examples:
        - url: '#'
          label: 'New Release'
    badge_links:
      type: array
      title: Badge links
      description: A list of badges
      examples:
        - url: '#'
          label: 'Bob'
        - url: '#'
          label: 'Fred'
    orientation:
      type: string
      title: Orientation
      description: "Set card to horz or vert."
      enum: ['stacked', 'landscape']
      examples:
        - 'stacked'
