'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: CardList
description: Hero with side by side slots for media and content.
group: Layouts/Cards
props:
  type: object
  properties:
    headingText:
      type: string
      title: Heading
      description: Title of article
      # @todo Add examples here.
      examples: 
        - 'This is my title eu torquent suscipit'
    cards:
      title: Cards
      description: A set of cards to display.
      type: array
      items:
        type: object
        properties:
          headingText:
            type: string
            title: Heading
            description: Title of article
            examples: 
              - 'This is my title eu torquent suscipit'
          media:
            type: object
            title: Media
            properties:
              src:
                type: string
                title: Source
                description: URL of image
                examples: 
                  - 'https://via.placeholder.com/150'
              alt:
                type: string
                title: Alt
                description: Alt text for image
                examples: 
                  - 'Placeholder image'
          content:
            type: string
            title: Content
            description: Content of article
            examples: 
              - 'This is my content. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nulla quis lorem ut libero malesuada feugiat.'
          orientation:
            type: string
            title: Orientation
            description: 'Set card to horz or vert.'
            enum:
              - stacked
              - horizontal
            examples: 
              - 'stacked'
      examples:
        - 
          headingText: 'This is my title eu torquent suscipit'
          media:
            src: 'https://via.placeholder.com/150'
            alt: 'Placeholder image'
          content: 'This is my content. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nulla quis lorem ut libero malesuada feugiat.'
          orientation: 'stacked'
    headingLevel:
      type: integer
      title: Heading Level
      description: "Set card to horz or vert."
      enum:
        - 1
        - 2
        - 3
      examples: [2]
slots:
  mediaslot:
    title: MediaSlot
    description: Slot to place media.
  contentslot:
    title: ContentSlot
    description: Slot to place content.
