'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Hero - Full width
description: Hero with stacked slots for media and content.
group: Layouts/Hero
props:
  type: object
  properties:
    layout:
      type: string
      title: Layout
      description: Set hero layout
      enum: 
        - "media-first (default)"
        - "media-last"
      examples: ["media-first (default)", "media-last"]
    heading_text:
      type: string
      title: Heading Text
      examples: 
        - 'From One Small Push to a Bold New Orbit'
    level:
      type: number
      title: Heading Level
      enum: 
        - 1
        - 2
        - 3
      default: 1
      examples: 
        - 1
    styles:
      type: string
      title: Heading Styles
      enum: 
        - "default"
        - "alt"
      default: alt
      examples: 
        - alt
    media:
      $ref: json-schema-definitions://experience_builder.module/image
      title: Media Image
      description: Media image for the hero.
      type: object
      examples:
        - src: 'assets/8474492.jpg'
          alt: 'Photo by RDNE Stock project: https://www.pexels.com/photo/an-astronaut-standing-in-a-desolate-environment-8474492/'
