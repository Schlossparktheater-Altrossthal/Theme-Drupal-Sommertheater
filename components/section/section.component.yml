'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Section
group: Layout
status: stable
description: A section for nested components
props:
  type: object
  properties:
    columns:
      type: string
      title: Column layout
      enum:
        - '100'
        - '50-50'
        - '33-33-33'
        - '75-25'
        - '25-75'
        - '67-33'
        - '33-67'
        - '50-25-25'
        - '25-25-50'
        - '25-25-25-25'
      examples:
        - '50-50'
      default:
        - '50-50'
    section_header:
      type: boolean
      title: Show Header Region
      examples:
        - true
      default:
        - true
    section_footer:
      type: boolean
      title: Show Footer Region
      examples:
        - true
      default:
        - true
    margin_block_start:
      type: string
      title: Margin top
      enum:
        - '0'
        - '8'
        - '20'
        - '32'
        - '48'
        - '64'
        - '96'
        - '128'
      examples:
        - '48'
    margin_block_end:
      type: string
      title: Margin bottom
      enum:
        - '0'
        - '8'
        - '20'
        - '32'
        - '48'
        - '64'
        - '96'
        - '128'
      examples:
        - '48'
    padding_block_start:
      type: string
      title: Padding top
      enum:
        - '0'
        - '16'
        - '32'
        - '64'
      examples:
        - '0'
    padding_block_end:
      type: string
      title: Padding bottom
      enum:
        - '0'
        - '16'
        - '32'
        - '64'
      examples:
        - '0'
    width:
      type: string
      title: Container width
      enum:
        - hg:lg:max-w-full
        - hg:lg:max-w-9/10
        - hg:lg:max-w-8/10
        - hg:lg:max-w-3/4
        - hg:lg:max-w-1/2
      meta:enum:
        hg:lg:max-w-full: 100%
        hg:lg:max-w-9/10: 90%
        hg:lg:max-w-8/10: 80%
        hg:lg:max-w-3/4: 75%
        hg:lg:max-w-1/2: 50%
      examples:
        - 'hg:lg:max-w-full'
    background:
      type: string
      title: Background color
      enum:
        - hg:bg-none
        - hg:bg-brand
        - hg:bg-brand-light
        - hg:bg-brand-dark
        - hg:bg-accent
        - hg:bg-accent-light
        - hg:bg-accent-dark
      meta:enum:
        hg:bg-none: None
        hg:bg-brand: Brand
        hg:bg-brand-light: Brand Light
        hg:bg-brand-dark: Brand Dark
        hg:bg-accent: Accent
        hg:bg-accent-light: Accent Light
        hg:bg-accent-dark: Accent Dark
      default:
        - 'hg:bg-none'
      examples:
        - 'hg:bg-none'

slots:
  header_slot:
    title: 'Section: Header'
  main_slot:
    title: 'Section: Main'
  footer_slot:
    title: 'Section: Footer'
