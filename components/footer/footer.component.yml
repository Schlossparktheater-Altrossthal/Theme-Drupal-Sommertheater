'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Footer
group: Pages/Footer
description: The site footer assembled
props:
  type: object
  properties:
    align:
      type: boolean
      title: Display links in row?
      description: Align links in row or stack
      examples:
        - true
    color_mode:
      type: string
      title: Color Mode
      enum: [light, dark]
      examples:
        - light
slots:
  footer_menu:
    title: Footer menu
    description: Place footer menu
  footer_bottom_first:
    title: Footer bottom first
    description: First bottom section
  footer_bottom_last:
    title: Footer bottom last
    description: Last bottom section
