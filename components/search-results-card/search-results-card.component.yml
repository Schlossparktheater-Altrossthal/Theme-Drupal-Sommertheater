'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Search Results
description: Search card with date, heading, description
group: Components/Search
props:
  type: object
  properties:
    event_date:
      type: object
      description: Event date with start and end time.
      format: date
      title: Blog post / article date
      examples:
        - start: '2025-06-17 16:00:00'
          end: '2025-06-24 18:00:00'
          format: 'M d, Y'
    title:
      type: object
      title: Heading Text
      description: Heading text for the search card.
      properties:
        $ref: '../../components/heading/heading.component.yml#/props'
      examples:
        - heading_text: 'Lorem ipsum dolor sit amet fringilla'
          level: 3
          url: 'https://www.google.com'
    date:
      type: string
      format: date
      title: Blog post / article date
      description: Date of the blog post or article.
      examples:
        - '2025-06-13'
    description:
      type: string
      title: Description
      examples:
        - 'Quaerat laborum rerum dolores dolores dolor qui. Laudantium itaque sint aut culpa omnis eius pariatur. Quia laborum commodi excepturi neque tempore. Fuga dolor dolores perspiciatis.'
    tags:
      type: array
      title: Tags
      description: Tags for the card.
      items:
        $ref: '../../components/link/link.component.yml#/props'
      examples:
        - text: 'New Release'
          url: 'https://www.google.com'
        - text: 'Featured'
          url: 'https://www.google.com'
    link:
      type: object
      title: Link
      description: Link for the card.
      properties:
        $ref: '../../components/link/link.component.yml#/props'
      examples:
        - text: 'Read more'
          url: 'https://www.google.com'
    media:
      $ref: json-schema-definitions://experience_builder.module/image
      title: Card Media
      description: Media and Alt for the card.
      type: object
      examples:
        - src: 'assets/placeholder.png'
          alt: 'Laudantium itaque sint aut culpa omnis'
