'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Pricing
description: Card with pricing information
group: Components/Cards
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading Text
      examples:
        - 'Gold Plan'
    description:
      type: string
      title: Description
      examples:
        - 'Curabitur nascetur non potenti pede luctus vivamus'
    price:
      title: Price
      description: Price of the product
      type: string
      examples:
        - '159.00'
    text:
      title: Text
      description: A text description of the pricing
      type: string
      examples:
        - '<ul>
            <li>Etiam suspendisse lobortis natoque</li>
            <li>Facilisis dictumst letius in</li>
            <li>Diam mus est faucibus ornare ut consectetuer metus</li>
          </ul>'
    cta:
      type: object
      title: CTA
      description: CTA for the card
      properties:
        url:
          type: string
          title: URL
          examples:
            - 'https://example.com'
        text:
          type: string
          title: Text
          examples:
            - 'Choose this plan'
    card_radius:
      type: number
      title: Corner radius
      description: Set card corner radius
      enum: [rounded-none, rounded-sm, rounded-md, rounded-lg]
      examples: 
        - rounded-none
      default: rounded-none 
    color_mode:
      type: string
      title: Color Mode
      enum: [light, dark, inherit]
      examples: 
        - light
      default: light
    
    