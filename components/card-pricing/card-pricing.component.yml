'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Pricing
description: Card with pricing information
group: Components/Cards
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading Text
      examples:
        - 'Name'
    level:
      type: number
      title: Heading Level
      enum: [2,3,4,5,6]
      examples:
        - 3
    background:
      type: string
      title: Card background color
      enum: [light, dark]
      examples: 
        - light
      default: light
    description:
      type: string
      title: Description
      examples:
        - 'Short description'
    price:
      title: Price
      description: Price of the product
      type: string
      examples:
        - '$100.00'
    text:
      title: Text
      description: A text description of the pricing
      type: string
      examples:
        - '<ul>
            <li>Feature 1</li>
            <li>Feature 2</li>
            <li>Feature 3</li>
          </ul>'
    radius:
      type: number
      title: Button radius
      enum: [rounded-none, rounded-sm, rounded-md, rounded-lg, rounded-full]
      examples: 
        - rounded-sm
      default: rounded-sm 
    cta_label:
      type: string
      title: CTA Label
      examples:
        - 'Choose this plan'
    cta:
      type: object
      title: CTA
      description: CTA for the card
      properties:
        url:
          type: string
          title: URL
          examples:
            - 'https://example.com'
        text:
          type: string
          title: Text
          examples:
            - 'Choose this plan'
        radius:
          type: number
          name: Corner radius
          enum: [rounded-none, rounded-sm, rounded-md, rounded-lg, rounded-full]
          examples: 
            - rounded-sm
          default: rounded-sm 
          
    
    