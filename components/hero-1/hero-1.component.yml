'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Hero - Full overlay
description: Hero with stacked slots for media and content.
group: Layouts/Hero
props:
  type: object
  properties:
    media:
      $ref: json-schema-definitions://experience_builder.module/image
      title: Media Image
      description: Media image for the hero.
      type: object
      examples:
        - src: 'assets/8474492.jpg'
          alt: 'Photo by RDNE Stock project: https://www.pexels.com/photo/an-astronaut-standing-in-a-desolate-environment-8474492/'
    heading_text:
      type: string
      title: Heading Text
      examples: 
        - 'One Giant Leap for Drupal'
    text:
      type: string
      title: Text
      examples: 
        - 'Lorem ipsum dolor sit amet himenaeos letius praesent mollis tempor nunc aliquam pede si eros habitant eleifend ac gravida.'
    level:
      type: number
      title: Heading Level
      enum: 
        - 1
        - 2
        - 3
      default: 1
      examples: 
        - 1
    background_position:
      type: string
      title: Hero background image position
      enum: 
        - center
        - top
        - bottom
      default: "center"
      examples: 
        - "center"
