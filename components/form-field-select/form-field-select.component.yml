'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Select
title: Select
description: Used to collect user selection.
group: Components/Form Elements
props:
  type: object
  properties:
    label:
      type: string
      title: Label
      description: The label for the text.
      examples:
        - 'Industry'
    id:
      type: string
      title: Name
      description: The name attribute for the text.
      examples:
        - 'industry'
    options:
      type: array
      title: Options
      description: The options for the select element.
      items:
        type: object
        properties:
          value:
            type: array
            title: Value
            description: The value of the option.
      examples:
          - value: "accounting"
            label: "Accounting/Finance"
          - value: "advertising"
            label: "Advertising/Public Relations"
          - value: "engineering"
            label: "Engineering"
          - value: "technology"
            label: "Technology"
    required:
      type: boolean
      title: Required
      description: Whether the text is required.
      examples:
        - true
    disabled:
      type: boolean
      title: Disabled
      description: Whether the text is disabled.
      examples:
        - false
