'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Heading
group: Particles
status: stable
description: Text wrapped in a heading tag
props:
  type: object
  properties:
    text:
      type: string
      title: Heading Text
      examples: 
        - One Giant Leap for Open Source
    level:
      type: number
      title: Heading Level
      enum: [1,2,3,4,5,6]
      examples: 
        - 1
    styles:
      type: string
      title: Heading Styles
      enum: [default, alt]
      examples: 
        - default
      default: default
    link:
      type: boolean
      title: Add optional link
      default: false
