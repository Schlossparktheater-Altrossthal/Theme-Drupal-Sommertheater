'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Heading
group: Particles
status: stable
description: Text wrapped in a heading tag
props:
  type: object
  properties:
    h_text:
      type: string
      title: Heading Text
      examples: 
        - Provide heading text
    h_level:
      type: number
      title: Heading Level
      enum: [1,2,3,4,5,6]
      examples: 
        - 1
    h_link:
      type: boolean
      title: Add optional link
      default: false
