'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Heading
group: Base
status: stable
description: Text wrapped in a heading tag
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading Text
      description: The heading text.
      default: 'Enter title'
      examples: 
        - One Giant Leap for Open Source
    level:
      type: number
      title: Heading Level
      description: The heading level (h1-h6).
      enum: [1,2,3,4,5,6]
      default: 2
      examples: 
        - 2
    styles:
      type: string
      title: Heading Styles
      description: The heading styles.
      enum: [default, alt]
      default: default
      examples: 
        - default
    align:
      type: string
      title: Text Alignment
      description: The heading alignment.
      enum:
        - left
        - center
        - right
      default: left
      examples: 
        - left
    url:
      type: string
      title: Add optional url
      description: The url for the heading.
      default: 'No URL'
      examples: 
        - 'No URL'
