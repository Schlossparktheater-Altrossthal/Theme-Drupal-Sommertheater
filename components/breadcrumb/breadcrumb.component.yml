$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Breadcrumb
description: A navigation component that displays the user's current location within a site hierarchy.
status: stable
props:
  type: object
  properties:
    breadcrumb:
      type: array
      title: breadcrumb
      description: Breadcrumb items.
      items:
        type: object
        title: Breadcrumb item
        description: Breadcrumb item.
        properties:
          url:
            type: string
            format: uri
          text:
            type: string
        required:
          - text
      examples:
        - text: Home
          url: /
        - text: Section
          url: /section
        - text: News
          url: /news
        - text: Events
          url: /events
        - text: Museum
          url: /museum
        - text: Current Page
          url: /current
