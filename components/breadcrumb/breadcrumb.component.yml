$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Breadcrumb
description: A navigation component that displays the user's current location within a site hierarchy.
group: Navigation/Breadcrumbs
props:
  type: object
  properties:
    breadcrumb:
      type: array
      title: Breadcrumb
      description: Breadcrumb items.
      items:
        type: object
        title: Breadcrumb item
        description: Breadcrumb item.
        properties:
          url:
            type: string
            format: uri
          text:
            type: string
        required:
          - text
      examples: []
