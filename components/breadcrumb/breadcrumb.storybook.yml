$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Breadcrumb
description: A navigation component that displays the user's current location within a site hierarchy.
group: Navigation
props:
  type: object
  properties:
    breadcrumb:
      type: array
      title: Breadcrumb
      description: Breadcrumb items.
      items:
        type: object
        title: Breadcrumb item
        description: Breadcrumb item.
        properties:
          url:
            type: string
            format: uri
          text:
            type: string
        required:
          - text
      examples: []

hide_main: true
breadcrumb:
  - text: Home
    url: /
  - text: Section
    url: /section
  - text: News
    url: /news
  - text: Events
    url: /events
  - text: Museum
    url: /museum
  - text: Current Page
    url: /current
