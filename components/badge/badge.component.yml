"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Badge
group: Base
status: stable
props:
  type: object
  properties:
    label:
      type: string
      title: Link text
      examples:
        - Badge text
    url:
      type: string
      title: Link
    style:
      type: string
      title: Style
      enum:
        - primary
        - secondary
      default: primary
      examples:
        - primary
    icon:
      type: string
      title: Icon name (exclude prefix)
      default: "rocket"
      examples:
        - "rocket"
    icon_first:
      type: boolean
      title: Icon first
      default: true
      examples:
        - true
