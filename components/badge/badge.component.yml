'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Badge
group: Base
status: stable
props:
  type: 'object'
  properties:
    color:
      type: string
      title: Color
      description: "Background color to use for the badge, one of 'primary' or 'secondary'."
      enum: [light, dark]
      examples: 
        - dark
    icon:
      type: string
      title: Icon
      description: 'Select an Icon.'
      enum: [close, bolt]
      examples: 
        - ''
      default: ''
    icon_first:
      type: boolean
      title: Icon First
      description: 'Icon can display before or after label.'
      examples:
        - true
      default: true
    radius:
      type: number
      name: Corner radius
      enum: [rounded-none, rounded-sm, rounded-md, rounded-lg, rounded-full]
      examples: 
        - rounded-sm
      default: rounded-sm 
    link:
      title:
      type: object
      description: 'The link object containing URL and text.'
      properties:
        url:
          type: string
          title: URL
          description: 'The URL to link to. If provided, the badge will be rendered as a link.'
          examples:
            - '#'
        label:
          type: string
          title: Link Text
          description: 'The text for the link.'
          examples:
            - 'New Release'
      examples:
        - url: '#'
          label: Example Tag 
slots:
  # Content to display in the badge.
  badge_content:
    title: Content
    description: Content of the badge
