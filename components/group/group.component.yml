'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Group
group: Layout
status: stable
description: A group for nested components
props:
  type: object
  properties:
    flex_direction:
      type: string
      title: Flex direction
      enum:
        - hg:flex-col
        - hg:flex-row
        - hg:flex-col hg:md:flex-row
        - hg:flex-col-reverse
        - hg:flex-row-reverse
      meta:enum:
        hg:flex-col: Column
        hg:flex-row: Row
        hg:flex-col hg:md:flex-row: Row (stacked on mobile)
        hg:flex-col-reverse: Column-reverse
        hg:flex-row-reverse: Row-reverse
      examples:
        - 'hg:flex-col'
    flex_gap:
      type: string
      title: Flex gap
      enum:
        - hg:gap-0
        - hg:gap-4 hg:md:gap-6 hg:xl:gap-8
        - hg:gap-8 hg:lg:gap-10 hg:xl:gap-12
      meta:enum:
        hg:gap-0: None
        hg:gap-4 hg:md:gap-6 hg:xl:gap-8: Default
        hg:gap-8 hg:lg:gap-10 hg:xl:gap-12: Large
      default: hg:gap-4 hg:md:gap-6 hg:xl:gap-8
      examples:
        - 'hg:gap-4 hg:md:gap-6 hg:xl:gap-8'
    flex_align_x:
      type: string
      title: Content align-x
      description: 'Adjust horizontal alignment of the content within the group.'
      enum:
        - start
        - center
        - end
        - between
      meta:enum:
        start: Start
        center: Center
        end: End
        between: Between
      default: 'center'
      examples:
        - 'center'
    flex_align_y:
      type: string
      title: Content align-y
      description: 'Adjust vertical alignment of the content within the group.'
      enum:
        - start
        - center
        - end
      meta:enum:
        start: Start
        center: Center
        end: End
      default: 'center'
      examples:
        - 'center'
    radius:
      type: string
      title: Border radius
      enum:
        - none
        - sm
        - md
        - lg
        - xl
      meta:enum:
        none: None
        sm: Small
        md: Medium
        lg: Large
        xl: Extra-Large
      examples:
        - 'none'
    padding:
      type: string
      title: Padding
      enum:
        - none
        - sm
        - md
        - lg
        - xl
      meta:enum:
        none: None
        sm: Small
        md: Medium
        lg: Large
        xl: Extra-Large
      examples:
        - 'none'
    border:
      type: boolean
      title: Border
      default: FALSE
      examples:
        - FALSE
    background:
      type: string
      title: Background color
      enum:
        - hg:bg-none
        - hg:bg-brand
        - hg:bg-brand-light
        - hg:bg-brand-dark
        - hg:bg-accent
        - hg:bg-accent-light
        - hg:bg-accent-dark
      meta:enum:
        hg:bg-none: None
        hg:bg-brand: Brand
        hg:bg-brand-light: Brand Light
        hg:bg-brand-dark: Brand Dark
        hg:bg-accent: Accent
        hg:bg-accent-light: Accent Light
        hg:bg-accent-dark: Accent Dark
      examples:
        - 'hg:bg-none'
    flex_align:
      type: string
      title: Vertical alignment
      description: 'Adjust vertical alignment of the group when nested inside other components.'
      enum:
        - start
        - center
        - end
      meta:enum:
        start: Top
        center: Middle
        end: Bottom
      default: 'center'
      examples:
        - 'center'

slots:
  group_slot:
    title: 'Group items'
