'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 02 Side-by-side
description: Hero with side by side slots for media and content.
group: Layouts/Hero
props:
  type: object
  properties:
    layout:
      type: string
      title: Layout
      description: Set hero layout
      enum: 
        - media-first (default)
        - media-last
      examples: [media-first (default), media-last]
    media:
      $ref: json-schema-definitions://experience_builder.module/image
      title: Media Image
      description: Media image for the hero.
      type: object
      examples:
        - src: 'assets/thumbnail.png'
          alt: 'A picture of the sea shore.'
    heading_text:
      type: string
      title: Heading Text
      examples: 
        - 'Castro Chemical'
    text:
      type: string
      title: Heading Text
      examples: 
        - 'Lorem ipsum dolor sit amet himenaeos letius praesent mollis tempor nunc aliquam pede si eros habitant eleifend ac gravida.'
    level:
      type: number
      title: Heading Level
      enum: [1,2,3,4,5,6]
      examples: 
        - 1
    background:
      type: string
      title: Hero background color
      enum: [light, dark]
      examples: 
        - light
      default: light
slots:
  mediaslot:
    title: MediaSlot
    description: Slot to place media.
  contentslot:
    title: ContentSlot
    description: Slot to place content.
