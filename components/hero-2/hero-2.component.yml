'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Hero - Side-by-side
description: Hero with side by side slots for media and content.
group: Layouts/Hero
props:
  type: object
  properties:
    layout:
      type: string
      title: Layout
      description: Set hero layout
      enum:
        - media-first (default)
        - media-last
      examples: [media-first (default), media-last]
    heading_text:
      type: string
      title: Heading Text
      examples:
        - Launching What Comes Next
    level:
      type: number
      title: Heading Level
      enum: 
        - 1
        - 2
        - 3
      default: 1
      examples:
        - 1
    text:
      type: string
      title: Heading Text
      examples:
        - 'Lorem ipsum dolor sit amet himenaeos letius praesent mollis tempor nunc aliquam pede si eros habitant eleifend ac gravida.'
    media:
      $ref: json-schema-definitions://experience_builder.module/image
      title: Media Image
      description: Media image for the hero.
      type: object
      examples:
        - src: 'assets/8474492.jpg'
          alt: 'Photo by RDNE Stock project: https://www.pexels.com/photo/an-astronaut-standing-in-a-desolate-environment-8474492/'
