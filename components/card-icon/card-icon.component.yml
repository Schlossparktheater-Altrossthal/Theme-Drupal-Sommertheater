$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Icon card
group: Card
props:
  type: object
  properties:
    tile_size:
      type: string
      title: Aspect ratio
      enum:
        - square
        - "4:3"
        - "16:9"
      meta:enum:
        square: Square
        "4:3": Rectangle 4 × 3
        "16:9": Rectangle 16 × 9
      examples:
        - square
    flex_align:
      type: string
      title: Alignment
      enum:
        - start
        - center
        - end
        - between
      default:
        - "center"
      examples:
        - "center"
    border:
      type: boolean
      title: Border
      default: TRUE
      examples:
        - TRUE
    border_radius:
      type: string
      title: Border radius
      enum:
        - small
        - large
        - extra-large
      meta:enum:
        small: Small
        large: Large
        extra-large: Extra large
      default: small
      examples:
        - small
    background:
      type: boolean
      title: Background
      default: FALSE
      examples:
        - FALSE
    text:
      type: string
      title: Heading text
      examples:
        - Heading
    description:
      type: string
      title: Paragraph text
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - "<p>This is placeholder text.</p>"
    text_align:
      type: string
      title: Text alignment
      enum:
        - left
        - center
        - right
      meta:enum:
        left: Left
        center: Center
        right: Right
      default: center
      examples:
        - center
    url:
      type: string
      title: Link
    icon:
      type: string
      title: Icon name
      description: The ID of an icon from the <a href=\"https://phosphoricons.com/\" target=\"_blank\">Phosphor Icons</a> library.
      default: "rocket"
      examples:
        - "rocket"
    icon_size:
      type: string
      title: Icon size
      enum:
        - small
        - regular
        - large
      meta:enum:
        small: Small
        regular: Regular
        large: Large
      default: regular
      examples:
        - regular
    icon_align:
      type: string
      title: Icon alignment
      enum:
        - left
        - right
        - center
      meta:enum:
        left: Left
        center: Center
        right: Right
      default: center
      examples:
        - center
