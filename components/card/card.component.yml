'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Card
description: Basic card with image, title, teaser, tags
group: Components
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading Text
      examples:
        - 'This is my title eu torquent suscipit'
    level:
      type: number
      title: Heading Level
      enum: [2,3,4,5,6]
      examples:
        - 3
    url:
      type: boolean
      title: Add optional url
      examples:
        - true
      default: true
    media:
      $ref: json-schema-definitions://experience_builder.module/image
      title: Card Media
      description: Media and Alt for the card.
      type: object
      examples:
        - src: 'assets/277628-911758.jpg'
          alt: 'Photo by gdtography: https://www.pexels.com/photo/long-exposure-photography-white-dome-building-interior-911758/'
    text:
      type: string
      title: Text
      description: Teaser text
      examples:
        - 'Quaerat laborum rerum dolores dolores dolor qui. Laudantium itaque sint aut culpa omnis eius pariatur. Quia laborum commodi excepturi neque tempore. Fuga dolor dolores perspiciatis.'
    radius:
      type: number
      name: Corner radius
      enum: [rounded-none, rounded-sm, rounded-md, rounded-lg, rounded-full]
      examples: 
        - rounded-sm
      default: rounded-sm
    badges:
      type: array
      title: badges
      description: Category badges.
      items:
        type: object
        title: Badge
        description: List of badges.
        properties:
          url:
            type: string
            format: uri
          label:
            type: string
      examples:
        - url: '#'
          label: 'badge one'
        - url: '#'
          label: 'badge two'
    badge_1:
      type: object
      title: Badge text 1
      description: A category badge
      # @todo Add examples here.
      examples:
        - url: '#'
          label: 'Amazing'
    badge_2:
      type: object
      title: Badge text 2
      description: A category badge
      # @todo Add examples here.
      examples:
        - url: '#'
          label: 'New Release'
    orientation:
      type: string
      title: Orientation
      description: "Set card to horz or vert."
      enum: ['stacked', 'landscape']
      examples:
        - 'stacked'
