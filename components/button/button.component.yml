$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Button
group: Base
description: "A versatile button component that can be rendered as a button or link with various styles and sizes."
status: stable
props:
  type: object
  required:
    - variant
    - size
  properties:
    variant:
      type: string
      title: Variant
      description: "The style of the button."
      enum:
        - primary
        - secondary
        - negative
      meta:enum:
        primary: Primary
        secondary: Secondary
        negative: Negative
      examples:
        - primary
    label:
      type: string
      title: Label
      description: "The text content of the button."
      default: "Button label"
      examples:
        - "Button label"
    href:
      type: string
      title: Link
    size:
      type: string
      title: Button size
      enum:
        - small
        - medium
        - large
      meta:enum:
        small: Small
        medium: Medium
        large: Large
      examples:
        - medium
    mobile_width:
      type: boolean
      title: Full width on mobile
      default: false
    icon:
      type: string
      title: Icon
      enum:
        - arrow-right
        - arrow-left
        - caret-right
        - caret-left
        - download
        - user-plus
      meta:enum:
        arrow-right: Arrow right
        arrow-left: Arrow left
        caret-right: Caret right
        caret-left: Caret left
        download: Download
        user-plus: User plus
      examples:
        - arrow-right
    icon_first:
      type: boolean
      title: Display icon first
      description: "By default, the icon is displayed after the label. If you want to display the icon first, set this to true."
      default: false
      examples:
        - false
    disabled:
      type: boolean
      title: Disabled
      description: "Style button as disabled (rarely used)."
      default: false
      examples:
        - false
        - true
