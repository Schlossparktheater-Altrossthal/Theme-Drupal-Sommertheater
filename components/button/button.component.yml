"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.3.x/core/assets/schemas/v1/metadata.schema.json"
name: "Button"
group: "Base"
description: "A versatile button component that can be rendered as a button or link with various styles and sizes."
status: "stable"
props:
  type: "object"
  properties:
    variant:
      type: "string"
      title: "Variant"
      description: "The style of button."
      enum:
        - "primary"
        - "primary-accent"
        - "secondary"
        - "secondary-accent"
        - "negative"
      default: "primary"
      examples:
        - "primary"
    disabled:
      type: "boolean"
      title: "Disabled"
      description: "Whether the button is disabled."
      default: false
      examples:
        - false
        - true
    label:
      type: "string"
      title: "Button text"
      description: "The text content of the button."
      default: "Button Label"
      examples:
        - "Button Label"
    size:
      type: "string"
      title: "Size"
      description: "Set Button Size."
      enum:
        - "small"
        - "medium"
        - "large"
      default: "medium"
      examples:
        - "medium"
    icon:
      type: "string"
      title: "Icon"
      description: "Select an Icon."
      enum: ["ph-arrow-right", "ph-arrow-left", "ph-carrot-right", "ph-carrot-left", "ph-download", "ph-user-plus"]
      default: "ph-arrow-right"
      examples:
        - "ph-arrow-right"
    icon_first:
      type: "boolean"
      title: "Icon First"
      description: "Icon can display before or after label."
      default: false
      examples:
        - false
    href:
      type: "boolean"
      title: "URL"
      description: "The URL to link to. If provided, the button will be rendered as a link."
      default: false
      examples:
        - false
