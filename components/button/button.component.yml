'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.3.x/core/assets/schemas/v1/metadata.schema.json'
name: Button
group: Base
description: 'A versatile button component that can be rendered as a button or link with various styles and sizes.'
status: stable
props:
  type: object
  properties:
    variant:
      type: string
      title: Variant
      description: 'The style of button.'
      enum:
        - light
        - dark
      examples:
        - light
    outline:
      type: boolean
      title: Outlined
      description: 'Whether the button is outlined.'
      default: false
      examples:
        - false
        - true
    disabled:
      type: boolean
      title: Disabled
      description: 'Whether the button is disabled.'
      default: false
      examples:
        - false
        - true
    label:
      type: string
      title: Button text
      description: 'The text content of the button.'
      examples:
        - 'Button Label'
    icon:
      type: string
      title: Icon
      description: 'Select an Icon.'
      enum: [arrow_forward, arrow_back, chevron_right, chevron_left, download, person_add]
      examples: 
        - arrow_forward
      default: arrow_forward
    icon_first:
      type: boolean
      title: Icon First
      description: 'Icon can display before or after label.'
      examples:
        - false
      default: false
    href:
      type: boolean
      title: URL
      description: 'The URL to link to. If provided, the button will be rendered as a link.'
      examples:
        - false
      default: false
    radius:
      type: string
      title: Corner radius
      enum: [rounded-none, rounded-sm, rounded-md, rounded-lg, rounded-full]
      examples: 
        - rounded-sm
      default: rounded-sm 
    color_mode:
      type: string
      title: Color Mode
      description: Color mode of component.
      enum: 
        - light
        - dark
      examples: 
        - light
      default: light