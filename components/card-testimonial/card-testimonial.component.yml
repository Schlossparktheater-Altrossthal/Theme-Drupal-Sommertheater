'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Testimonial
group: Components/Cards
props:
  type: object
  properties:
    text:
      type: string
      title: Blockquote text
      description: The blockquote text.
      examples:
        - '“My career coach’s guidance was crucial in helping me understand the tech industry landscape and ultimately secure my role.”'
    cite_name:
      type: string
      title: Cite name
      description: The cite name.
      examples:
        - 'Isiah Julio'
    cite_text:
      type: string
      title: Cite text
      description: The cite text.
      examples:
        - 'Engineer, Technical Services'
    cite_url:
      type: string
      title: Cite URL
      description: The cite url.
      examples:
        - ''
    media:
      $ref: json-schema-definitions://experience_builder.module/image
      title: Card Media
      description: Media and Alt for the card.
      type: object
      examples:
        - src: 'assets/portrait.png'
          alt: 'Photo by gdtography: https://www.pexels.com/photo/long-exposure-photography-white-dome-building-interior-911758/'
    align:
      type: string
      title: Text alignment
      description: Set alignment of text
      enum: [center, left]
      examples: 
        - center
      default: center
    color_mode:
      type: string
      title: Color Mode
      enum: [light, dark]
      examples: 
        - light
      default: light
