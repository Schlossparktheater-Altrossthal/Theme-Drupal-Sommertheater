'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Grid Section
group: Layouts/Grid Section
status: stable
description: A Column container
props:
  type: object
  properties:
    columns:
      type: string
      label: Column layout
      enum:
        - '100'
        - '50-50'
        - '33-33-33'
        - '75-25'
        - '25-75'
        - '67-33'
        - '33-67'
        - '50-25-25'
        - '25-25-50'
        - '25-25-25-25'
      examples:
        - '50-50'
      default:
        - '50-50'
    show_header:
      type: boolean
      title: Show Header Region
      examples:
        - false
      default:
        - false
    show_footer:
      type: boolean
      title: Show Footer Region
      examples:
        - false
      default:
        - false
    margin_before:
      type: string
      title: Space Before
      enum: ['none','tight','normal','extra']
      examples: 
        - 'normal'
    margin_after:
      type: string
      title: Space After
      enum: ['none','tight','normal','extra']
      examples: 
        - 'normal'
    width:
      type: string
      title: Container Width
      enum: ['full', '9/10', '8/10', '3/4', '1/2']
      examples: 
        - 'full'
    color_mode:
      type: string
      title: Color Mode
      enum: [light, dark]
      examples: 
        - light
      default: light
slots:
  header_region:
    title: Header
  container_region:
    title: Container
  footer_region:
    title: Footer