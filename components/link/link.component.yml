name: Link
description: A customizable link component with text, title, style, and an optional icon.
group: Base
status: stable
props:
  type: object
  properties:
    text:
      type: string
      title: Link Text
      description: The text inside the link.
      examples:
        - This is a link
    title:
      type: string
      title: Link Title
      description: Tooltip text shown on hover.
      examples:
        - 'This is a link title'
    style:
      type: string
      title: Link Style
      description: Choose the link style.
      enum:
        - default
        - button-outline-light
        - button-outline-dark
        - button-light
        - button-dark
        - button-brand
        - button-brand-dark
      examples:
        - 'default'
    radius:
      type: number
      name: Corner radius
      enum: [rounded-none, rounded-sm, rounded-md, rounded-lg, rounded-full]
      examples: 
        - rounded-sm
      default: rounded-sm 
    icon:
      type: string
      title: Icon Class
      description: An optional icon to display before the text (e.g., FontAwesome or Heroicons class).
      examples:
        - 'fa-solid fa-arrow-right'
    url:
      type: string
      title: URL
      description: The destination URL of the link.
      examples:
        - '#'
