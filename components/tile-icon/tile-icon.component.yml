$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Icon
description: A component showing its children in a grid on desktop and in a horizontally-scrolling line on mobile.
group: Components/Tiles
props:
  type: object
  required:
    - text
  properties:
    text:
      type: string
      title: Text
      examples:
        - Heading
    description:
      type: string
      title: Text
      examples:
        - Lorem ipsum dolor sit amet luctus rutrum
    border:
      type: boolean
      title: Border
      description: Add a border to the tile.
      default: true
      examples:
        - true
    icon:
      type: string
      title: Phosphor icon slug
      default: 'rocket'
      examples:
        - 'ph-rocket'
    icon_align:
      type: string
      title: Icon alignment
      enum:
        - hg:justify-start
        - hg:justify-end
        - hg:justify-center
      meta:enum:
        hg:justify-start: Left
        hg:justify-end: Right
        hg:justify-center: Center
      default:
        - 'hg:justify-center'
      examples:
        - 'hg:justify-center'
    tile_size:
      type: string
      title: Set tile size
      enum:
        - hg:aspect-none
        - hg:aspect-square
        - hg:aspect-4/3
        - hg:aspect-16/9
      meta:enum:
        hg:aspect-none: None
        hg:aspect-square: Square
        hg:aspect-4/3: 4 × 3
        hg:aspect-16/9: 16 × 9
      default:
        - 'hg:aspect-none'
      examples:
        - 'hg:aspect-none'
    url:
      type: string
      title: Link
