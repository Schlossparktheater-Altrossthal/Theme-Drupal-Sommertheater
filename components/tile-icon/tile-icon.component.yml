$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Icon
description: A component showing its children in a grid on desktop and in a horizontally-scrolling line on mobile.
group: Components/Tiles
props:
  type: object
  required:
    - background
    - text
  properties:
    background:
      title: Background color
      type: string
      enum:
        - light
        - medium
        - dark
      default: medium
      examples:
        - light
    text:
      title: Text
      type: string
      examples:
        - BRAND
    description:
      title: Text
      type: string
      examples:
        - Lorem ipsum dolor sit amet luctus rutrum
    icon:
      title: Material Symbols icon slug
      type: string
      examples:
        - deblur
    icon_position:
      title: Icon left/right
      type: string
      enum:
        - left
        - right
      default: right
      examples:
        - right
    url:
      title: Link URL
      type: string
      examples:
        - https://drupal.org
    color_mode:
      type: string
      title: Color Mode
      enum: [light, dark, inherit]
      examples: 
        - light
      default: light