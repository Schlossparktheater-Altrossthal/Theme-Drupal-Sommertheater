$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Icon
description: A component showing its children in a grid on desktop and in a horizontally-scrolling line on mobile.
group: Components/Tiles
props:
  type: object
  required:
    - background
    - text
  properties:
    text:
      type: string
      title: Text
      examples:
        - BRAND
    description:
      type: string
      title: Text
      examples:
        - Lorem ipsum dolor sit amet luctus rutrum
    icon:
      type: string
      title: Phosphor icon slug
      default: "ph-rocket"
      examples:
        - "ph-rocket"
    icon_position:
      type: string
      title: Icon left/right
      enum:
        - left
        - right
      default: right
      examples:
        - right
    url:
      type: string
      title: Link URL
      default: "https://drupal.org"
      examples:
        - https://drupal.org
