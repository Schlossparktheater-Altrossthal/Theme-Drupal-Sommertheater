$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Icon Tile
description: A component showing its children in a grid on desktop and in a horizontally-scrolling line on mobile.
group: Components
props:
  type: object
  properties:
    text:
      type: string
      title: Tile heading
      examples:
        - Heading
    description:
      type: string
      title: Tile description
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - '<p>
            This is placeholder text.
          </p>'
    icon_align:
      type: string
      title: Tile alignment
      enum:
        - hg:justify-start
        - hg:justify-end
        - hg:justify-center
      meta:enum:
        hg:justify-start: Left
        hg:justify-end: Right
        hg:justify-center: Center
      default:
        - 'hg:justify-center'
      examples:
        - 'hg:justify-center'
    tile_size:
      type: string
      title: Tile size
      enum:
        - hg:aspect-none
        - hg:aspect-square
        - hg:aspect-4/3
        - hg:aspect-16/9
      meta:enum:
        hg:aspect-none: None
        hg:aspect-square: Square
        hg:aspect-4/3: 4 × 3
        hg:aspect-16/9: 16 × 9
      default:
        - 'hg:aspect-none'
      examples:
        - 'hg:aspect-none'
    url:
      type: string
      title: Tile Link (optional)
    icon:
      type: string
      title: Icon name (exclude prefix)
      default: 'rocket'
      examples:
        - 'rocket'
    icon_size:
      type: string
      title: Icon size
      enum:
        - hg:text-2xl
        - hg:text-4xl
        - hg:text-6xl
      meta:enum:
        hg:text-2xl: Small
        hg:text-4xl: Regular
        hg:text-6xl: Large
      default:
        - 'hg:text-4xl'
      examples:
        - 'hg:text-4xl'
    border:
      type: boolean
      title: Show border
      description: Add a border to the tile.
      default: TRUE
      examples:
        - TRUE
    border_radius:
      type: string
      title: Rounded Corners
      description: Set rounded corner radius
      enum:
        - hg:rounded-none
        - hg:rounded-sm
        - hg:rounded-xl hg:md:rounded-2xl
        - hg:rounded-[24px] hg:md:rounded-[32px]
      meta:enum:
        hg:rounded-none: None
        hg:rounded-sm: Small
        hg:rounded-xl hg:md:rounded-2xl: Large
        hg:rounded-[24px] hg:md:rounded-[32px]: Extra-Large
      default: hg:rounded-sm
      examples:
        - 'hg:rounded-sm'
    background:
      type: boolean
      title: Show background
      description: Add a background to the tile.
      default: FALSE
      examples:
        -  FALSE
