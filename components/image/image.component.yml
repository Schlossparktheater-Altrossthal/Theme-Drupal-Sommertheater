$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Image
description: An image component.
group: Base
props:
  type: object
  properties:
    media:
      $ref: json-schema-definitions://experience_builder.module/image
      title: Image
      description: Media and Alt for the card.
      type: object
      examples:
        - src: 'assets/957040.jpg'
          alt: 'Placeholder text.'
    size:
      title: Aspect-ratio
      description: Set the aspect-ratio of the image container
      type: string
      enum: ['4/3', '3/2', '2/1', '1/1', '16/9']
      default: '4/3'
      examples:
        - '4/3'
    caption:
      title: Caption
      description: Set optional caption
      type: string
      default: 'This is a caption example'
      examples:
        - 'This is a caption example'