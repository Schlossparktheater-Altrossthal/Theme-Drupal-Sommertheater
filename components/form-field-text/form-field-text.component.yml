'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Text Field
description: Used to collect user input.
group: Components/Form Elements
props:
  type: object
  properties:
    label:
      type: string
      title: Label
      description: The label for the text field.
      examples:
        - 'First Name'
    id:
      type: string
      title: Name
      description: The name attribute for the text field.
      examples:
        - 'first_name'
    value:
      type: string
      title: Value
      description: The default value for the text field.
    placeholder:
      type: string
      title: Placeholder
      description: The placeholder text for the text field.
      examples:
        - 'Enter your first name'
    required:
      type: boolean
      title: Required
      description: Whether the text field is required.
      examples:
        - true
    disabled:
      type: boolean
      title: Disabled
      description: Whether the text field is disabled.
      examples:
        - false
