'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Two Columns
group: Layouts/Columns
status: stable
description: A Two Column container
props:
  type: object
  properties:
    size_column_one:
      type: integer
      title: Column 1 size
      enum: [25, 33.3, 40, 50, 66.7, 75]
      examples: 
        - 50
    size_column_two:
      type: integer
      title: Column 2 size
      enum: [25, 33.3, 40, 50, 66.7, 75]
      examples: 
        - 50
    color_mode:
      type: string
      title: Color Mode
      enum: [light, dark, inherit]
      examples: 
        - light
      default: light
slots:
  col_one:
    title: Column 1
    description: The first of two columns
  col_two:
    title: Column 2
    description: The second of two columns