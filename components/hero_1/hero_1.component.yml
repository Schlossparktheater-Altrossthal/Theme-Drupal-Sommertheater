'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 01 Full overlay
description: Hero with stacked slots for media and content.
group: Layouts/Hero
props:
  type: object
  properties:
    media:
      $ref: json-schema-definitions://experience_builder.module/image
      title: Media Image
      description: Media image for the hero.
      type: object
      examples:
        - src: 'assets/seashore.png'
          alt: 'A picture of the sea shore.'
        - src: 'assets/vaportrails.jpg'
          alt: 'A bold and colorful hero banner.'
        - src: 'assets/mermaid.jpg'
          alt: 'A team of professionals collaborating.'
    heading_text:
      type: string
      title: Heading Text
      examples: 
        - 'We are a brand acceleration agency'
    text:
      type: string
      title: Heading Text
      examples: 
        - 'Lorem ipsum dolor sit amet himenaeos letius praesent mollis tempor nunc aliquam pede si eros habitant eleifend ac gravida.'
    level:
      type: number
      title: Heading Level
      enum: [1,2,3,4,5,6]
      examples: 
        - 1
    background:
      type: string
      title: Hero background color
      enum: [light, dark, image]
      examples: 
        - image
      default: image
    background_position:
      type: string
      title: Hero background image position
      enum: [center, top, bottom]
      examples: 
        - center
      default: center
slots:
  mediaslot:
    title: MediaSlot
    description: Slot to place media.
  contentslot:
    title: ContentSlot
    description: Slot to place content.
