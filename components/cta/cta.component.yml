$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: CTA
description: A CTA section with inline styles for testing purposes
group: Layouts/CTA
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading
      description: The main heading of the cta
      examples:
        - Lorem ipsum dolor sit amet finibus aliquam pharetra
    level:
      type: number
      title: Heading Level
      enum: [1,2,3,4,5,6]
      examples: 
        - 2
    text:
      type: string
      title: Text
      examples:
        - Lorem ipsum dolor sit amet finibus aliquam pharetra mauris aenean pellentesque enim mus.
    links:
      type: array
      title: Links
      description: CTA links
      properties:
        url:
          type: string
          format: uri
        text:
          type: string
      examples:
        - url: '#'
          text: 'button text 1'
          style: 'default'
        - url: '#'
          text: 'button text 2'
    media:
      $ref: json-schema-definitions://experience_builder.module/image
      title: Background Image
      description: The background image for the cta.
      type: object
      examples:
        - src: 'assets/256381.jpg'
          alt: 'Photo by pixabay'
    radius:
      type: string
      title: Button Corner Radius
      enum: [rounded-none, rounded-sm, rounded-md, rounded-lg, rounded-full]
      examples: 
        - rounded-sm
      default: rounded-sm 
    text_align:
      type: string
      title: Text alignment
      description: Set alignment of text
      enum: [center, left, right]
      examples: 
        - center
      default: center
    background:
      type: string
      title: CTA background color
      enum: [light, dark, image]
      examples: 
        - light
      default: light