'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Event
description: Event card with date, heading, description
group: Components/Cards
props:
  type: object
  properties:
    title:
      type: string
      title: Heading Text
      examples:
        - 'Transition'
    event_date:
      type: string
      format: date
      title: Event Date
      examples:
        - '2026-02-12'
    description:
      type: string
      title: Description
      examples:
        - 'Atque libero fuga blanditiis quo qui impedit debitis. Aut ut nam unde velit.'
    place:
      title: Place
      description: Place of the event
      type: string
      examples:
        - '29013 Bednar Spurs'
    color_mode:
      type: string
      title: Color Mode
      description: Color mode of component.
      enum: 
        - light
        - dark
      examples: 
        - light
      default: light
