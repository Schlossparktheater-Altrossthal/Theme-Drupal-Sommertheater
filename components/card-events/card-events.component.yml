"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Event card
group: Card
props:
  type: object
  properties:
    title:
      type: string
      title: Heading
      default: "Enter name of event"
      examples:
        - "Transition"
    event_date:
      type: string
      title: Date
      default: "2026-01-01"
      examples:
        - "2026-02-12"
    description:
      type: string
      title: Description
      default: "Atque libero fuga blanditiis quo qui impedit debitis. Aut ut nam unde velit."
      examples:
        - "Atque libero fuga blanditiis quo qui impedit debitis. Aut ut nam unde velit."
    place:
      title: Location
      type: string
      default: "123 Main St"
      examples:
        - "123 Main St"
