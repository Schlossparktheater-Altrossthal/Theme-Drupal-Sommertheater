'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Results
description: Search card with date, heading, description
group: Components/Search
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading Text
      description: The heading text.
      default: 'Enter title'
      examples: 
        - One Giant Leap for Open Source
    link:
      type: object
      title: The Link
      description: The link for the heading.
      properties:
        text:
          type: string
        url:
          type: string
        icon:
          type: string
        style:
          type: string
      examples:
        - text: 'Testing'
          url: 'https://www.google.com'
          icon: 'chevron_right'
          style: 'button-outline-light'
    description:
      type: string
      title: Description
      description: The description of the search results.
      examples: 
        - 'Lorem ipsum dolor sit amet fringilla'