$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Horizontal Scroller
description: A component showing its children in a grid on desktop and in a horizontally-scrolling line on mobile.
group: Layouts/Horz Scroller
props:
  type: object
  properties:
    columns_on_desktop:
      type: integer
      default: 4
      enum: [1, 2, 3, 4, 5, 6]
      description: The number of columns to display on desktop.
      examples:
        - 4
slots:
  logos:
    title: Logos
    description: Components to arrange in a grid or horizontal scroller
