'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Service Card
description: Service card with image, title, teaser, tags
group: Components/Cards
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading Text
      examples:
        - 'Service'
    level:
      type: number
      title: Heading Level
      enum: [2,3,4,5,6]
      examples:
        - 3
    url:
      type: string
      title: Add optional url
      examples: 
        - https://www.example.com
    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Card Media
      description: Media and Alt for the card.
      type: object
      examples:
        - src: 'assets/277628-911758.jpg'
          alt: 'Photo by gdtography: https://www.pexels.com/photo/long-exposure-photography-white-dome-building-interior-911758/'
    text:
      type: string
      title: Text
      description: Teaser text
      examples:
        - 'Quaerat laborum rerum dolores dolores dolor qui. Laudantium itaque sint aut culpa omnis eius pariatur.'
    aspect_ratio:
      type: string
      title: Image Aspect Ratio
      description: "Set card to horz or vert."
      enum: ['narrow', 'rectangle']
      examples:
        - narrow
    alignment:
      type: string
      title: Text Alignment
      description: "Set card to horz or vert."
      enum: ['left', 'center']
      examples:
        - center
    color_mode:
      type: string
      title: Color Mode
      enum: [light, dark]
      examples: 
        - dark
