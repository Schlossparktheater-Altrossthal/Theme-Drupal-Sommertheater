'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Form
description: Used to collect user input.
group: Components/Forms
props:
  type: object
  properties:
    id:
      type: string
      title: Form ID
      description: The unique identifier for the form.
      examples:
        - contact-form
    method:
      type: string
      title: Method
      description: The HTTP method to use for form submission.
      enum: [GET, POST]
      examples:
        - POST
    action:
      type: string
      title: Action
      description: The URL to which the form will be submitted.
      examples:
        - /submit-form
    text_field:
      type: object
      title: Text Field
      description: A text field for user input.
      examples:
        - properties:
            label: 'First Name'
            placeholder: 'Enter your first name'
            id: 'first-name'
            name: 'first_name'
            required: true
            disabled: false
