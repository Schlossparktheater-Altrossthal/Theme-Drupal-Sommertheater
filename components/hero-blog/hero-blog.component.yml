'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Hero - Blog
description: Hero with side by side slots for media and content.
group: Layouts/Heroes

props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading Text
      default: 'Enter the title'
      examples:
        - 'Vivamus curae metus neque mollis orci ipsum sapien velit cursus'

    level:
      type: integer
      title: Heading Level
      enum: [1, 2, 3, 4, 5, 6]
      examples:
        - 1

    date:
      type: string
      title: Published Date
      default: '2026-02-12'
      examples:
        - '2026-02-12'

    author:
      type: string
      title: Author
      examples:
        - 'John Smith'

    author_url:
      type: string
      title: Author Link
      default: ''
      examples: []

    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Media Image
      description: Media image for the hero.
      type: object
      examples:
        - src: 'assets/starshot.png'
          alt: 'Photo by RDNE Stock project: https://www.pexels.com/photo/an-astronaut-standing-in-a-desolate-environment-8474492/'
slots:
  blog_media:
    title: 'Place Image'
