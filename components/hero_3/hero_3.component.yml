'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 03 Full width
description: Hero with stacked slots for media and content.
group: Layouts/Hero
props:
  type: object
  properties:
    layout:
      type: string
      title: Layout
      description: Set hero layout
      enum: 
        - media-first (default)
        - media-last
      examples: [media-first (default), media-last]
    media:
      $ref: json-schema-definitions://experience_builder.module/image
      title: Media Image
      description: Media image for the hero.
      type: object
      examples:
        - src: 'assets/8474492.jpg'
          alt: 'Photo by RDNE Stock project: https://www.pexels.com/photo/an-astronaut-standing-in-a-desolate-environment-8474492/'
    heading_text:
      type: string
      title: Heading Text
      examples: 
        - 'From One Small Push to a Bold New Orbit'
    level:
      type: number
      title: Heading Level
      enum: [1,2,3,4,5,6]
      examples: 
        - 1
    styles:
      type: string
      title: Heading Styles
      enum: [default, alt]
      examples: 
        - alt
      default: alt
    background:
      type: string
      title: Hero background color
      enum: [light, dark]
      examples: 
        - light
      default: light
slots:
  mediaslot:
    title: MediaSlot
    description: Slot to place media.
  contentslot:
    title: ContentSlot
    description: Slot to place content.
