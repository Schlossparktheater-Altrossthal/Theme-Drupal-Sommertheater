name: Mercury
type: theme
"base theme": false
libraries:
  - mercury/global
  - mercury/phosphor-icons
  - mercury/messages
libraries-extend:
  user/drupal.user:
    - mercury/user
  core/drupal.dropbutton:
    - mercury/dropbutton
  core/drupal.dialog:
    - mercury/dialog
  file/drupal.file:
    - mercury/file
  core/drupal.progress:
    - mercury/progress
description: "A scalable, modern Drupal CMS prototype theme, integrating cutting-edge front-end tools and a flexible, component-based design system."
core_version_requirement: ^11
generator: "starterkit_theme:11.1.1"
dependencies:
  - twig_tweak:twig_tweak
  - twig_field_value:twig_field_value
components:
  namespaces:
    mercury: components
